name: TSM deal scan

on:
  schedule:
    - cron: "17 * * * *" # hourly, off the top of the hour to avoid GitHub's busiest minute
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tsm_deals/**", "tests/**", "config.json", "data/**", ".github/workflows/tsm-deals.yml"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tsm-deals
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Remembers which deals were already sent so you are not pinged with the same one every hour.
      - name: Restore sent-deal history
        uses: actions/cache/restore@v4
        with:
          path: state
          key: tsm-deals-state-${{ github.run_id }}
          restore-keys: tsm-deals-state-

      - name: Scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m tsm_deals

      - name: Save sent-deal history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: tsm-deals-state-${{ github.run_id }}
