name: TSM deal scan

on:
  schedule:
    - cron: "17 * * * *" # hourly, off the top of the hour to avoid GitHub's busiest minute
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["tsm_deals/**", "tests/**", "config.json", ".github/workflows/tsm-deals.yml"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tsm-deals
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Auction snapshots, realm list, item types and already-sent deals, kept between runs.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: tsm-deals-state-${{ github.run_id }}
          restore-keys: tsm-deals-state-

      - name: Scan
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m tsm_deals

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: tsm-deals-state-${{ github.run_id }}
